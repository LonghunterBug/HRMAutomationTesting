# Admin account for login
ADMIN_USERNAME=admin_example
ADMIN_PASSWORD=123456
# Browser default chrome, edge, firefox, safari
BROWSER=chrome
# Environment
URL=https://hrm.anhtester.com/erp/login
# Headless mode only for chrome or firefox and local execution
HEADLESS=false
# Config system
SLEEP_TIME=0
WAIT_EXPLICIT=10
# Report information
EXPORT_VIDEO_PATH=exports/video
EXPORT_CAPTURE_PATH=exports/screenshot
